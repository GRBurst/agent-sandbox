# FR-13. Every claim this repository makes, checked on a clean machine, for
# every platform it supports, on every change.
#
# It deploys nothing and publishes nothing. The one artefact it uploads is the
# reach each platform resolved, and it exists so that the next job can compare
# the two — which is the single assertion in the suite that no one machine can
# make (FR-20).
#
# `on` is quoted so that it stays the string it is: YAML 1.1 reads a bare `on`
# as a boolean, and both yamllint and the check that reads this file would then
# be looking at a key that is not there.
name: verify

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # SC-8: one job, one command, two platforms. The matrix carries the system
  # this repository names alongside the runner image that provides it, so the
  # set of platforms verified is readable off this file and comparable against
  # the flake's own outputs rather than restated in prose.
  suite:
    strategy:
      # Both platforms report, always. Cancelling the second the moment the
      # first goes red would leave the cross-platform comparison with one side.
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The substituter the flake declares, restated rather than inherited. nix
      # ignores a flake's own nixConfig for anyone who is not a trusted user,
      # and whether the runner is one differs by platform: measured on this
      # workflow, the macOS job printed "ignoring untrusted flake configuration
      # setting 'extra-substituters'" 180 times and the Linux job not once. So
      # these two lines, which land in nix.conf and need no trust, are what
      # makes the substituter available on both. `extra-` rather than plain, so
      # cache.nixos.org is added to and not replaced.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # SC-4: this is the whole report. No `continue-on-error`, no `|| true`,
      # nothing conditional and nothing that reads a human — the job's exit
      # status is the suite's, and a commit is accepted or rejected on it.
      #
      # No `--layer`. Restricting the run to the cheapest layer is exactly the
      # violation plan.md records against `check_j7_1`, because a green run of
      # the unit layer says nothing about the layers it skipped.
      - name: Every layer of the suite
        id: suite
        shell: nix develop --accept-flake-config --command bash -e {0}
        run: ./scripts/validate.sh

      # FR-20: the confinement description this platform resolved, with the
      # execution substrate removed, so the next job can assert that nothing
      # under lib/ made the description platform-dependent.
      #
      # Read what this does and does not carry before trusting it. Dropping
      # every `/nix/store/` string does not thin `filesystem.read`, it
      # **empties** it — the substrate is the whole of that list. With
      # `filesystem.allow`, `groups.include` and the leak registry all empty
      # too, what survives is the `$WORKDIR` placeholders, `workdir.access` and
      # the state redirection. Measured on run 10: the two artefacts came back
      # byte-identical.
      #
      # So this is a comparison of *authorship*, not of reach, and it can only
      # differ if someone adds a platform conditional that resolves to a path
      # outside the store. That is a real thing to catch and it is the whole
      # claim. It is **not** SC-8's second clause: the effective reach does
      # differ between the platforms, in nono's own floor groups, which grant
      # `/usr/bin` here and `/private/etc`, `/System/Library` and `/tmp` there.
      # No artefact sees that — the resolved manifest lists no non-store grant
      # at all, while `nono why` answers `granted_path` for `/usr/bin` against
      # the same description — so no diff of descriptions or of manifests can
      # express it, however it is filtered. Comparing effective reach is a hand
      # step, and docs/HANDBOOK.md carries it with its procedure.
      #
      # The substrate is dropped rather than compared because it legitimately
      # differs: `strace` is in the Linux closure and in no other.
      - name: The description this platform resolved
        id: reach
        shell: nix develop --accept-flake-config --command bash -e {0}
        run: |
          for a in $(nix eval --json --accept-flake-config '.#agents' \
            --apply builtins.attrNames | jq -r '.[]'); do
            nix build --no-link --print-out-paths --accept-flake-config \
              ".#confinement-$a" |
              xargs jq -S --arg a "$a" '{ ($a): walk(
                if type == "array"
                then map(select(type != "string"
                  or (startswith("/nix/store/") | not)))
                elif type == "object"
                then with_entries(select(.value | type != "string"
                  or (startswith("/nix/store/") | not)))
                else . end) }'
          done | jq -s add >reach.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reach-${{ matrix.system }}
          path: reach.json

  # FR-20: neither platform's description was authored differently. This is the
  # one assertion no single machine can make, which is why it lives here rather
  # than in a check.
  #
  # It is deliberately not named for SC-8. SC-8's second clause — that the
  # effective reach observed is the same on both — is verified by hand and said
  # so in docs/HANDBOOK.md, because the reach the two platforms actually grant
  # differs in nono's own floor and no artefact either runner can upload
  # expresses it. Naming this job after a claim it cannot make is how a green
  # run comes to mean less than it reads.
  platforms:
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reach-*
          path: reach

      # Two guards before the comparison, because an equality assertion is
      # satisfied most easily by there being nothing to compare: fewer than two
      # reports, or a report that is empty, both make a diff agree forever.
      - name: Neither platform's description was authored differently
        run: |
          mapfile -t reports < <(printf '%s\n' reach/*/reach.json | sort)
          if [ "${#reports[@]}" -lt 2 ]; then
            printf 'only %s platform reported its reach\n' "${#reports[@]}"
            exit 1
          fi
          for r in "${reports[@]}"; do
            if [ ! -s "$r" ]; then
              printf '%s is empty, so comparing it agrees with anything\n' "$r"
              exit 1
            fi
          done
          for r in "${reports[@]:1}"; do
            diff -u "${reports[0]}" "$r"
          done
